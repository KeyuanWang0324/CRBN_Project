<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CRBN Project</title>
    <style>
      /* ---- your style: keep it, change it, make it yours ---- */
      :root {
        --bg: #0b1020;
        --panel: #121a2b;
        --panel-soft: #1a2540;
        --text: #edf2ff;
        --muted: #a8b3cf;
        --accent: #7c9cff;
        --accent-strong: #5a7cff;
        --border: rgba(255, 255, 255, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, var(--bg), #0f172a 40%, #111827);
        color: var(--text);
        min-height: 100vh;
      }

      .container {
        width: min(1100px, calc(100% - 32px));
        margin: 0 auto;
      }

      header {
        padding: 28px 0;
      }

      nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
      }

      .brand {
        font-size: 1.3rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      /* ---- tabs: click a tab, one section shows at a time ---- */
      .tabs {
        display: flex;
        gap: 26px;
      }

      .tab-btn {
        background: none;
        border: none;
        font: inherit;
        color: var(--muted);
        cursor: pointer;
        padding: 6px 2px;
        border-bottom: 2px solid transparent;
        transition: color 0.2s ease, border-color 0.2s ease;
      }

      .tab-btn:hover {
        color: var(--text);
      }

      .tab-btn.active {
        color: var(--text);
        border-bottom-color: var(--accent);
      }

      main {
        padding: 26px 0 60px;
      }

      .tab {
        display: none;
      }

      .tab.active {
        display: block;
      }

      /* ---- content styles you can reuse ---- */
      .page-title {
        font-size: clamp(2.2rem, 5vw, 4rem);
        line-height: 1.08;
        margin: 0 0 18px;
      }

      .page-summary {
        font-size: 1.08rem;
        line-height: 1.7;
        color: var(--muted);
        max-width: 620px;
      }

      .card {
        background: rgba(18, 26, 43, 0.92);
        border: 1px solid var(--border);
        border-radius: 22px;
        padding: 24px;
        box-shadow: 0 18px 45px rgba(0, 0, 0, 0.2);
      }

      @media (max-width: 760px) {
        nav {
          flex-direction: column;
          align-items: flex-start;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="container">
        <nav>
          <div class="brand">CRBN</div>
          <!-- the two tabs -->
          <div class="tabs">
            <button class="tab-btn active" data-tab="overview">Overview</button>
            <button class="tab-btn" data-tab="team">Team</button>
          </div>
        </nav>
      </div>
    </header>

    <main class="container">
      <!-- ===== OVERVIEW ===== -->
      <section id="overview" class="tab active">
        <!-- Write your project title on the line below (between the tags). -->
        <h1 class="page-title"></h1>

        <!-- Write a one- or two-sentence summary of the project below. -->
        <p class="page-summary"></p>
      </section>

      <!-- ===== TEAM ===== -->
      <section id="team" class="tab">
        <!-- Write your team here yourself: names and what each person did. -->
      </section>
    </main>

    <script>
      // clicking a tab shows its section and hides the others
      document.querySelectorAll(".tab-btn").forEach(function (btn) {
        btn.addEventListener("click", function () {
          document.querySelectorAll(".tab-btn").forEach(function (b) {
            b.classList.remove("active");
          });
          document.querySelectorAll(".tab").forEach(function (t) {
            t.classList.remove("active");
          });
          btn.classList.add("active");
          document.getElementById(btn.dataset.tab).classList.add("active");
        });
      });
    </script>
  </body>
</html>
